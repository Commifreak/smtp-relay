services:
  mta-relay:
    build: .
    image: mta-relay:latest
    container_name: mta-relay
    restart: unless-stopped
    env_file: .env
    ports:
      - "25:2525"     # SMTP from the local network
      - "8080:8080"   # web UI
    volumes:
      - mta-relay-data:/data

volumes:
  mta-relay-data:
