services:
  mta-relay:
    # Major version tag: receives all 1.x updates, never jumps to a new major version.
    image: ghcr.io/commifreak/mta-relay:1
    # To build from source instead, replace the image line above with:
    # build: .
    container_name: mta-relay
    restart: unless-stopped
    env_file: .env
    ports:
      - "25:2525"     # SMTP from the local network
      - "8080:8080"   # web UI
    volumes:
      - mta-relay-data:/data

volumes:
  mta-relay-data:
