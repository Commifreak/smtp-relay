<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}MTA-Relay{% endblock %} · MTA-Relay</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">MTA-Relay</a>
  <nav>
    <a href="/" class="{{ 'active' if request.url.path == '/' or request.url.path.startswith('/messages') }}">Mail history</a>
    {% set qn = queue_count() %}
    <a href="/queue" class="{{ 'active' if request.url.path.startswith('/queue') }}">Queue{% if qn %} <span class="count">{{ qn }}</span>{% endif %}</a>
    <a href="/sessions" class="{{ 'active' if request.url.path.startswith('/sessions') }}">SMTP sessions</a>
    <a href="/tools" class="{{ 'active' if request.url.path.startswith('/tools') }}">Diagnostics</a>
    <a href="/settings" class="{{ 'active' if request.url.path.startswith('/settings') }}">Settings</a>
  </nav>
  <label class="live"><input type="checkbox" id="autorefresh"> Auto-refresh</label>
</header>
<main>
{% if auth_disabled %}<div class="alert warn">The web UI is not password protected. Set <code>WEBUI_PASSWORD</code> to restrict access.</div>{% endif %}
{% block content %}{% endblock %}
</main>
<footer>MTA-Relay {{ version }}</footer>
<script src="/static/app.js"></script>
</body>
</html>
