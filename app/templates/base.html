<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}smtp-relay{% endblock %} · smtp-relay</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">smtp-relay</a>
  {% if not bare %}
  <nav>
    <a href="/" class="{{ 'active' if request.url.path == '/' or request.url.path.startswith('/messages') }}">Mail history</a>
    {% set qn = queue_count() %}
    <a href="/queue" class="{{ 'active' if request.url.path.startswith('/queue') }}">Queue{% if qn %} <span class="count">{{ qn }}</span>{% endif %}</a>
    <a href="/sessions" class="{{ 'active' if request.url.path.startswith('/sessions') }}">SMTP sessions</a>
    <a href="/tools" class="{{ 'active' if request.url.path.startswith('/tools') }}">Diagnostics</a>
    <a href="/settings" class="{{ 'active' if request.url.path.startswith('/settings') }}">Settings</a>
  </nav>
  <label class="live"><input type="checkbox" id="autorefresh"> Auto-refresh</label>
  {% if request.state.user is defined %}
  <form method="post" action="/logout" class="user">
    <span title="{{ 'Signed in via proxy' if request.state.auth_source == 'proxy' else 'Signed in' }}">{{ request.state.user }}</span>
    <button>Log out</button>
  </form>
  {% endif %}
  {% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>smtp-relay {{ version }}</footer>
<script src="/static/app.js"></script>
</body>
</html>
